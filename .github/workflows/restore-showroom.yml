name: Restore complete showroom build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-showroom.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract the approved build
        shell: python
        run: |
          import hashlib, pathlib, subprocess, zipfile
          archive = pathlib.Path("MetroCarDeals-Version4.zip")
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "f7a121bc4db7586076bc4fd2172fff11f5871ada59995694c07f72a889714921", "Archive differs from verified build"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              files = [n for n in z.namelist() if not n.endswith("/")]
              assert len(files) == 267
              assert all(f"assets/frames/{i:04d}.webp" in files for i in range(1,242))
              for name in files:
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and ".." not in p.parts and not any(s.startswith(".") for s in p.parts)
                  assert not p.is_symlink()
                  assert not p.exists() or p.read_bytes() == z.read(name), "Existing file differs: " + name
              for name in files:
                  p = pathlib.Path(name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(name))
              for name in files:
                  assert pathlib.Path(name).read_bytes() == z.read(name)
              subprocess.run(["git", "add", "--", *files], check=True)
      - name: Commit complete assets and folder structure
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore complete Version 4 showroom assets and folders"
          git push origin HEAD:main
